<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Tracker</title>
<link rel="stylesheet" href="style.css?v=1794515712">
</head>
<body>

<header>
  <h1>Progress Tracker</h1>
</header>

<main>

  <section class="dashboard">
    <a class="card-link" href="squat.html">
      <div class="card clickable">
        <h2>Squat</h2>
        <p class="value"><span id="value-squat">--</span></p>
      </div>
    </a>
    <a class="card-link" href="bench.html">
      <div class="card clickable">
        <h2>Bench</h2>
        <p class="value"><span id="value-bench">--</span></p>
      </div>
    </a>
    <a class="card-link" href="deadlift.html">
      <div class="card clickable">
        <h2>Deadlift</h2>
        <p class="value"><span id="value-deadlift">--</span></p>
      </div>
    </a>
    <div class="card">
      <h2>Weight</h2>
      <p class="value"><span id="value-weight">--</span><span id="weight-trend"></span></p>
    </div>
  </section>

  <section class="forms-grid">

    <div class="update-section half">
      <h2>Enter New TM</h2>

      <div class="input-row">
        <label for="input-squat">Squat</label>
        <input type="number" id="input-squat" inputmode="decimal" placeholder="Enter squat">
        <button class="update-btn" data-type="squat">Update</button>
      </div>

      <div class="input-row">
        <label for="input-bench">Bench</label>
        <input type="number" id="input-bench" inputmode="decimal" placeholder="Enter bench">
        <button class="update-btn" data-type="bench">Update</button>
      </div>

      <div class="input-row">
        <label for="input-deadlift">Deadlift</label>
        <input type="number" id="input-deadlift" inputmode="decimal" placeholder="Enter deadlift">
        <button class="update-btn" data-type="deadlift">Update</button>
      </div>

      <div class="input-row">
        <label for="input-weight">Weight</label>
        <input type="number" id="input-weight" inputmode="decimal" placeholder="Enter body weight">
        <button class="update-btn" data-type="body weight">Update</button>
      </div>
    </div>

    <div class="cardio-section">
      <h2>Enter Cardio</h2>

      <div class="input-row">
        <label for="input-cardio-duration">Duration (min)</label>
        <input type="number" id="input-cardio-duration" inputmode="decimal" placeholder="e.g. 31">
      </div>

      <div class="input-row">
        <label for="input-cardio-distance">Distance (mi)</label>
        <input type="number" id="input-cardio-distance" inputmode="decimal" placeholder="e.g. 2.3">
      </div>

      <div class="input-row">
        <label for="input-cardio-calories">Calories</label>
        <input type="number" id="input-cardio-calories" inputmode="decimal" placeholder="e.g. 459">
      </div>

      <button id="log-cardio-btn" class="update-btn btn-block">Log Cardio</button>
    </div>

  </section>

  <p id="status-msg"></p>

  <section class="charts-section">
    <div class="charts-grid">
      <div class="chart-card">
        <h3>This Week's Cardio</h3>
        <div class="donut-wrap" id="weekly-donut"></div>
      </div>
      <div class="chart-card">
        <h3>This Month's Calories</h3>
        <div class="donut-wrap" id="monthly-donut"></div>
      </div>
    </div>
  </section>

</main>

<script src="config.js?v=1794515712"></script>
<script src="app.js?v=1794515712"></script>
</body>
</html>
